
name: Deploy React and PHP API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js for the React build
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install frontend dependencies
        run: npm ci

      # 4. Build React + TypeScript for production
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /api

      # 5. Deploy React production files to the domain root
      - name: Deploy React frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dist/
          server-dir: /public_html/jhomeligacio.site/
          state-name: .ftp-sync-frontend.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # 6. Deploy PHP API files
      - name: Deploy PHP API
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: api/
          server-dir: /public_html/jhomeligacio.site/api/
          state-name: .ftp-sync-api.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/.env.*
            **/tests/**
            **/node_modules/**

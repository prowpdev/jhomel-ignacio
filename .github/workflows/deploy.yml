
name: Deploy React and PHP API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: Deploy React frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dist/
          server-dir: /public_html/jhomelignacio.site/
          state-name: .ftp-sync-frontend.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Deploy PHP API
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: api/
          server-dir: /public_html/jhomelignacio.site/api/
          state-name: .ftp-sync-api.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/.env.*
            **/tests/**
            **/node_modules/**
